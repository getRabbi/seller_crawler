name: CI Web

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run health:worker
      - run: npm run build
        env:
          NEXT_PUBLIC_WORKER_API_BASE_URL: https://api.example.invalid
      - run: npm audit --omit=dev
