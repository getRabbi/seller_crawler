[project]
name = "seller-intelligence"
version = "0.0.0"
description = "Zero-cost hybrid runner seller intelligence platform bootstrap."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "phonenumbers>=8.13,<9",
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.7.10",
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0,<7",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["crawler"]
testpaths = ["crawler/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "crawler"
files = ["crawler/sellerintel", "crawler/tests"]

[tool.coverage.run]
source = ["crawler/sellerintel/extractors"]

[tool.coverage.report]
fail_under = 90
show_missing = true
